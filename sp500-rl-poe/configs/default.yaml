# Default experiment config. Notebooks must read dates from here — never hard-code.

seed: 42

# Which dataset (see configs/datasets.yaml) and which universe (below).
# Switch to `ab_wrds` once the two AB_finRL CSVs are in data/raw/ab_wrds/.
dataset: synthetic

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  results_dir: results

dates:
  # Inclusive calendar bounds for the raw extract (includes indicator warm-up).
  start: "2019-01-02"
  end: "2023-12-29"
  train_start: "2020-01-02"
  train_end: "2022-12-30"
  test_start: "2023-01-03"
  test_end: "2023-12-29"

universe:
  # rule = a named list below | full_window | top_n | listed
  #   named list  : fixed tickers (no bias beyond the list)
  #   full_window : names present on every date in [start, end]   (survivorship)
  #   top_n       : top-N by market_cap (else avg dollar volume) on train_start, held fixed
  #   listed      : names in the dataset's `tickers` file ∩ prices, full-window survivors
  rule: ab_finrl
  lists:
    # The 10 names selected in AB_finRL.
    ab_finrl: [AAPL, MSFT, JNJ, JPM, XOM, PG, HD, UNH, CAT, DIS]
    # Scratch list for quick experiments. Edit freely.
    sandbox: [AAPL, MSFT, JNJ, JPM, XOM, PG, HD, UNH, CAT, DIS]
  top_n: 50
  # market_cap if the column exists, else average dollar volume
  top_n_metric: market_cap

missing_days:
  # drop_ticker | ffill  — never silent
  policy: drop_ticker
  ffill_max_gap: 5

features:
  indicators:
    - macd
    - rsi_30
    - cci_30
    - dx_30
  log_return: true
  rolling_vol_window: 20

poe:
  features:
    - close
    - high
    - low
    - macd
    - rsi_30
    - cci_30
    - dx_30
  valuation_feature: close
  time_window: 50
  normalize_df: by_previous_time
  comission_fee_model: trf
  # Placeholder. AllianceBernstein has not supplied a transaction-cost figure.
  comission_fee_pct: 0.001
  return_last_action: true
  initial_amount: 1000000
  cwd: results
  new_gym_api: false
  reward_scaling: 1
