# Default experiment config. Notebooks must read dates from here — never hard-code.

seed: 42

paths:
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  results_dir: results
  # AB_finRL WRDS extract — drop the CSVs here (gitignored).
  wrds_tickers: data/raw/wrds_tickers.csv
  wrds_processed: data/raw/wrds_processed.csv
  # Optional copy of the 10 names selected in AB_finRL (gitignored). When
  # missing, YAML ``universe.ab_finrl_tickers`` / configs/ab_finrl_tickers.csv
  # is used. A ``selected`` flag on wrds_tickers also overrides YAML.
  ab_finrl_tickers: data/raw/ab_finrl_tickers.csv

dates:
  # Inclusive calendar bounds for the raw extract (includes indicator warm-up).
  start: "2019-01-02"
  end: "2023-12-29"
  train_start: "2020-01-02"
  train_end: "2022-12-30"
  test_start: "2023-01-03"
  test_end: "2023-12-29"

universe:
  # sandbox | ab_finrl | full_window | top_n | wrds_tickers
  # wrds_tickers = names in wrds_tickers.csv ∩ prices, then full-window survivors.
  # ab_finrl = the 10 names selected in AB_finRL (sidecar CSV, selected flag, or list below).
  rule: sandbox
  sandbox_tickers:
    - AAPL
    - MSFT
    - JNJ
    - JPM
    - XOM
    - PG
    - HD
    - UNH
    - CAT
    - DIS
  ab_finrl_tickers:
    - AAPL
    - MSFT
    - JNJ
    - JPM
    - XOM
    - PG
    - HD
    - UNH
    - CAT
    - DIS
  top_n: 50
  # market_cap if the column exists, else average dollar volume
  top_n_metric: market_cap

missing_days:
  # drop_ticker | ffill  — never silent
  policy: drop_ticker
  ffill_max_gap: 5

features:
  indicators:
    - macd
    - rsi_30
    - cci_30
    - dx_30
  log_return: true
  rolling_vol_window: 20

column_map: null

adapter: wrds_crsp

poe:
  features:
    - close
    - high
    - low
    - macd
    - rsi_30
    - cci_30
    - dx_30
  valuation_feature: close
  time_window: 50
  normalize_df: by_previous_time
  comission_fee_model: trf
  # Placeholder. AllianceBernstein has not supplied a transaction-cost figure.
  comission_fee_pct: 0.001
  return_last_action: true
  initial_amount: 1000000
  cwd: results
  new_gym_api: false
  reward_scaling: 1
